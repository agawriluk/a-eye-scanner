<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Eye Card Lookup</title>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      padding: 16px;
      max-width: 520px;
      margin: auto;
      color: white;
      background: radial-gradient(ellipse at center, #3a0a0a 0%, #1a0a00 40%, #0a1a0a 70%, #000000 100%);
      min-height: 100vh;
      text-shadow: 2px 2px 4px #000, -1px -1px 2px #000;
    }
    h2 {
      text-align: center;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
      opacity: 0.9;
    }
    button, input {
      padding: 14px;
      font-size: 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      background: linear-gradient(180deg, #c41e3a 0%, #8b0000 100%);
      color: white;
      border: 2px solid #ffd700;
      text-shadow: 1px 1px 2px #000;
      font-weight: bold;
      letter-spacing: 1px;
    }
    button:active {
      background: #6b0000;
    }
    input {
      background: rgba(0,0,0,0.6);
      border: 2px solid #ffd700;
      color: white;
    }
    input::placeholder {
      color: #aaa;
    }
    #video {
      width: 100%;
      margin: 16px 0;
      border-radius: 8px;
      background: #111;
      display: none;
      border: 2px solid #ffd700;
    }
    #result {
      margin-top: 16px;
      padding: 16px;
      background: rgba(0,0,0,0.7);
      border-radius: 12px;
      border: 2px solid #ffd700;
      min-height: 50px;
    }
    .error { color: #ff6b6b; }
    .grade {
      font-size: 48px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
      text-shadow: 3px 3px 6px #000;
      margin: 10px 0;
    }
    .grade-label {
      text-align: center;
      font-size: 14px;
      letter-spacing: 3px;
    }
    p { margin: 8px 0; }
  </style>
</head>
<body>
  <h2>A-EYE GRADING</h2>
  <div class="subtitle">CARD VERIFICATION</div>
  <button id="startBtn">START SCANNER</button>
  <input id="manualInput" type="text" placeholder="OR TYPE SERIAL AND PRESS ENTER">
  <video id="video" autoplay playsinline muted></video>
  <div id="result">READY TO SCAN</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd8c6Cg6CowtIjaqnNSKPpZ6UuOIg520o5pgYOU9WxBXUE3OeaMxaZQTZBY2MA5fVbA/exec";

    const startBtn = document.getElementById("startBtn");
    const resultDiv = document.getElementById("result");
    const manualInput = document.getElementById("manualInput");
    const video = document.getElementById("video");

    const codeReader = new ZXing.BrowserMultiFormatReader();

    manualInput.onkeydown = function(e) {
      if (e.key === "Enter" && this.value.trim()) {
        lookup(this.value.trim());
      }
    };

    startBtn.onclick = function() {
      startBtn.style.display = "none";
      video.style.display = "block";
      resultDiv.innerHTML = "<p>STARTING CAMERA...</p>";

      codeReader.decodeFromVideoDevice(null, "video", function(result, err) {
        if (result) {
          codeReader.reset();
          video.style.display = "none";
          const code = result.getText();
          resultDiv.innerHTML = "<p style='color:#90ee90'>SCANNED: <b>" + code + "</b></p>";
          lookup(code);
        }
        if (err && !(err instanceof ZXing.NotFoundException)) {
          console.error(err);
        }
      }).catch(function(err) {
        video.style.display = "none";
        resultDiv.innerHTML = "<p class='error'>CAMERA ERROR: " + err + "</p><button onclick='location.reload()'>TRY AGAIN</button>";
      });
    };

    async function lookup(barcode) {
      resultDiv.innerHTML = "<p>LOOKING UP " + barcode + "...</p>";
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "barcode=" + encodeURIComponent(barcode)
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        resultDiv.innerHTML = "<p class='error'>LOOKUP FAILED: " + err.message + "</p><button onclick='location.reload()'>TRY AGAIN</button>";
      }
    }

    function showResult(response) {
      video.style.display = "none";
      if (response.error) {
        resultDiv.innerHTML = "<p class='error'>" + response.error + "</p><button onclick='location.reload()'>SCAN AGAIN</button>";
        return;
      }
      const d = response.data;
      let html = "<div class='grade-label'>GRADE</div>";
      html += "<div class='grade'>" + (d["FINAL GRADE"] || "—") + "</div>";
      const fields = ["SERIAL","CHARACTER","SET","YEAR","SET #","TCG","LANGUAGE","FOIL","CENTERING","SURFACE","CORNERS","EDGES","COMMENTS"];
      fields.forEach(function(key) {
        if (d[key]) {
          html += "<p><b>" + key + ":</b> " + d[key] + "</p>";
        }
      });
      html += "<button onclick='location.reload()'>SCAN ANOTHER</button>";
      resultDiv.innerHTML = html;
    }
  </script>
</body>
</html>

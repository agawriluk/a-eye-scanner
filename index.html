<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Eye Card Lookup</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
      background: #f8f9fa;
    }
    h2 { text-align: center; }
    button, input {
      padding: 14px;
      font-size: 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
    }
    input { border: 1px solid #ccc; }
    #reader { width: 100%; margin: 16px 0; }
    #result {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      min-height: 50px;
    }
    .error { color: #d32f2f; }
    .grade { font-size: 28px; font-weight: bold; color: #1a73e8; text-align: center; }
  </style>
</head>
<body>
  <h2>A-Eye Card Lookup</h2>
  <button id="startBtn">Start Scanner</button>
  <input id="manualInput" type="text" placeholder="Type serial and press Enter">
  <div id="reader"></div>
  <div id="result">Ready</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd8c6Cg6CowtIjaqnNSKPpZ6UuOIg520o5pgYOU9WxBXUE3OeaMxaZQTZBY2MA5fVbA/exec";

    const startBtn = document.getElementById("startBtn");
    const resultDiv = document.getElementById("result");
    const manualInput = document.getElementById("manualInput");
    let html5QrCode;

    manualInput.onkeydown = function(e) {
      if (e.key === "Enter" && this.value.trim()) {
        lookup(this.value.trim());
      }
    };

    startBtn.onclick = function() {
      startBtn.style.display = "none";
      resultDiv.innerHTML = "<p>Starting camera...</p>";

      // Explicitly enable Code 128 and other common barcodes
      const formats = [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ];

      html5QrCode = new Html5Qrcode("reader", { formatsToSupport: formats });

      html5QrCode.start(
        { facingMode: "environment" },
        { 
          fps: 10, 
          qrbox: { width: 300, height: 100 }
        },
        function(decodedText) {
          html5QrCode.stop();
          resultDiv.innerHTML = "<p style='color:green'>Scanned: <b>" + decodedText + "</b></p>";
          lookup(decodedText);
        },
        function() {}
      ).catch(function(err) {
        resultDiv.innerHTML = "<p class='error'>Camera error: " + err + "</p><button onclick='location.reload()'>Try Again</button>";
      });
    };

    async function lookup(barcode) {
      resultDiv.innerHTML = "<p>Looking up " + barcode + "...</p>";
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "barcode=" + encodeURIComponent(barcode)
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        resultDiv.innerHTML = "<p class='error'>Lookup failed: " + err.message + "</p><button onclick='location.reload()'>Try Again</button>";
      }
    }

    function showResult(response) {

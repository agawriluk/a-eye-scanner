<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Eye Card Lookup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
      background: #f8f9fa;
    }
    h2 { text-align: center; }
    button, input {
      padding: 14px;
      font-size: 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
    }
    input { border: 1px solid #ccc; }
    #video {
      width: 100%;
      margin: 16px 0;
      border-radius: 8px;
      background: #111;
    }
    #result {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      min-height: 50px;
    }
    .error { color: #d32f2f; }
    .grade { font-size: 28px; font-weight: bold; color: #1a73e8; text-align: center; }
  </style>
</head>
<body>
  <h2>A-Eye Card Lookup</h2>
  <button id="startBtn">Start Scanner</button>
  <input id="manualInput" type="text" placeholder="Type serial and press Enter">
  <video id="video" autoplay playsinline muted></video>
  <div id="result">Ready</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd8c6Cg6CowtIjaqnNSKPpZ6UuOIg520o5pgYOU9WxBXUE3OeaMxaZQTZBY2MA5fVbA/exec";

    const startBtn = document.getElementById("startBtn");
    const resultDiv = document.getElementById("result");
    const manualInput = document.getElementById("manualInput");
    const video = document.getElementById("video");
    let scanning = false;
    let stream = null;

    manualInput.onkeydown = function(e) {
      if (e.key === "Enter" && this.value.trim()) {
        lookup(this.value.trim());
      }
    };

    startBtn.onclick = async function() {
      if (scanning) return;
      if (!("BarcodeDetector" in window)) {
        resultDiv.innerHTML = "<p class='error'>BarcodeDetector is not supported in this browser. Try Chrome on Android.</p>";
        return;
      }

      scanning = true;
      startBtn.style.display = "none";
      resultDiv.innerHTML = "<p>Starting camera...</p>";

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        await video.play();

        const detector = new BarcodeDetector({ formats: ["code_128", "code_39", "ean_13", "ean_8", "upc_a", "upc_e"] });

        const scan = async () => {
          if (!scanning) return;
          try {
            const barcodes = await detector.detect(video);
            if (barcodes.length > 0) {
              const code = barcodes[0].rawValue;
              scanning = false;
              if (stream) stream.getTracks().forEach(t => t.stop());
              resultDiv.innerHTML = "<p style='color:green'>Scanned: <b>" + code + "</b></p>";
              lookup(code);
              return;
            }
          } catch (e) {}
          requestAnimationFrame(scan);
        };
        scan();
        resultDiv.innerHTML = "<p>Camera ready. Point at the barcode.</p>";
      } catch (err) {
        resultDiv.innerHTML = "<p class='error'>Camera error: " + err.message + "</p><button onclick='location.reload()'>Try Again</button>";
        scanning = false;
        startBtn.style.display = "block";
      }
    };

    async function lookup(barcode) {
      resultDiv.innerHTML = "<p>Looking up " + barcode + "...</p>";
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "barcode=" + encodeURIComponent(barcode)
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        resultDiv.innerHTML = "<p class='error'>Lookup failed: " + err.message + "</p><button onclick='location.reload()'>Try Again</button>";
      }
    }

    function showResult(response) {
      if (response.error) {
        resultDiv.innerHTML = "<p class='error'>" + response.error + "</p><button onclick='location.reload()'>Scan Again</button>";
        return;
      }
      const d = response.data;
      let html = "<div class='grade'>" + (d["FINAL GRADE"] || "—") + "</div>";
      const fields = ["SERIAL","CHARACTER","SET","YEAR","SET #","TCG","LANGUAGE","FOIL","CENTERING","SURFACE","CORNERS","EDGES","COMMENTS"];
      fields.forEach(function(key) {
        if (d[key]) {
          html += "<p><b>" + key + ":</b> " + d[key] + "</p>";
        }
      });
      html += "<button onclick='location.reload()'>Scan Another</button>";
      resultDiv.innerHTML = html;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Eye Card Lookup</title>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
      background: #f8f9fa;
    }
    h2 { text-align: center; }
    button, input {
      padding: 14px;
      font-size: 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
    }
    input { border: 1px solid #ccc; }
    #interactive {
      width: 100%;
      margin: 16px 0;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
    }
    #interactive video {
      width: 100%;
      height: auto;
      display: block;
    }
    #result {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      min-height: 50px;
    }
    .error { color: #d32f2f; }
    .grade { font-size: 28px; font-weight: bold; color: #1a73e8; text-align: center; }
  </style>
</head>
<body>
  <h2>A-Eye Card Lookup</h2>
  <button id="startBtn">Start Scanner</button>
  <input id="manualInput" type="text" placeholder="Type serial and press Enter">
  <div id="interactive"></div>
  <div id="result">Ready</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd8c6Cg6CowtIjaqnNSKPpZ6UuOIg520o5pgYOU9WxBXUE3OeaMxaZQTZBY2MA5fVbA/exec";

    const startBtn = document.getElementById("startBtn");
    const resultDiv = document.getElementById("result");
    const manualInput = document.getElementById("manualInput");
    let scanning = false;

    manualInput.onkeydown = function(e) {
      if (e.key === "Enter" && this.value.trim()) {
        lookup(this.value.trim());
      }
    };

    startBtn.onclick = function() {
      if (scanning) return;
      scanning = true;
      startBtn.style.display = "none";
      resultDiv.innerHTML = "<p>Starting camera...</p>";

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          target: document.querySelector("#interactive"),
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        locator: {
          patchSize: "medium",
          halfSample: true
        },
        numOfWorkers: 2,
        frequency: 10,
        decoder: {
          readers: ["code_128_reader"]
        },
        locate: true
      }, function(err) {
        if (err) {
          resultDiv.innerHTML = "<p class='error'>Camera error: " + (err.message || err) + "</p><button onclick='location.reload()'>Try Again</button>";
          scanning = false;
          startBtn.style.display = "block";
          return;
        }
        Quagga.start();
        resultDiv.innerHTML = "<p>Camera ready. Point at the barcode.</p>";
      });

      Quagga.onDetected(function(data) {
        if (!scanning) return;
        const code = data.codeResult && data.codeResult.code;
        if (code) {
          scanning = false;
          Quagga.stop();
          resultDiv.innerHTML = "<p style='color:green'>Scanned: <b>" + code + "</b></p>";
          lookup(code);
        }
      });
    };

    async function lookup(barcode) {
      resultDiv.innerHTML = "<p>Looking up " + barcode + "...</p>";
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "barcode=" + encodeURIComponent(barcode)
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        resultDiv.innerHTML = "<p class='error'>Lookup failed: " + err.message + "</p><button onclick='location.reload()'>Try Again</button>";
      }
    }

    function showResult(response) {
      if (response.error) {
        resultDiv.innerHTML = "<p class='error'>" + response.error + "</p><button onclick='location.reload()'>Scan Again</button>";
        return;
      }
      const d = response.data;
      let html = "<div class='grade'>" + (d["FINAL GRADE"] || "—") + "</div>";
      const fields = ["SERIAL","CHARACTER","SET","YEAR","SET #","TCG","LANGUAGE","FOIL","CENTERING","SURFACE","CORNERS","EDGES","COMMENTS"];
      fields.forEach(function(key) {
        if (d[key]) {
          html += "<p><b>" + key + ":</b> " + d[key] + "</p>";
        }
      });
      html += "<button onclick='location.reload()'>Scan Another</button>";
      resultDiv.innerHTML = html;
    }
  </script>
</body>
</html>

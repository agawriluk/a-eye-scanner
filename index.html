<script>
  // ⚠️ Make sure this is your real Apps Script URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd8c6Cg6CowtIjaqnNSKPpZ6UuOIg520o5pgYOU9WxBXUE3OeaMxaZQTZBY2MA5fVbA/exec";

  const startBtn = document.getElementById('startBtn');
  const resultDiv = document.getElementById('result');
  let html5QrCode;

  startBtn.onclick = startScanner;

  function startScanner() {
    startBtn.style.display = 'none';
    resultDiv.innerHTML = '<p>Starting camera...</p>';
    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      { 
        fps: 15,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      },
      onScanSuccess,
      onScanFailure
    ).catch(err => {
      resultDiv.innerHTML = `<p class="error">Camera error: ${err}</p>
        <button onclick="location.reload()">Try Again</button>`;
    });
  }

  function onScanFailure(error) {
    // Ignore most scan failures (they happen constantly while looking)
    // Only show something if it's a real problem
  }

  async function onScanSuccess(decodedText, decodedResult) {
    resultDiv.innerHTML = `<p style="color:green;">Scanned: <strong>${decodedText}</strong></p>
      <p>Looking up...</p>`;

    try {
      html5QrCode.stop();
    } catch(e) {}

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "barcode=" + encodeURIComponent(decodedText)
      });
      const result = await response.json();
      showResult(result);
    } catch (err) {
      resultDiv.innerHTML = `<p class="error">Lookup failed: ${err.message}</p>
        <p>Scanned value was: ${decodedText}</p>
        <button onclick="location.reload()">Try Again</button>`;
    }
  }

  function showResult(response) {
    if (response.error) {
      resultDiv.innerHTML = `<p class="error">${response.error}</p>
        <button onclick="location.reload()">Scan Again</button>`;
      return;
    }

    const d = response.data;
    let html = `<div class="grade">${d['FINAL GRADE'] || '—'}</div>`;

    const fields = [
      'SERIAL', 'CHARACTER', 'SET', 'YEAR', 'SET #',
      'TCG', 'LANGUAGE', 'FOIL',
      'CENTERING', 'SURFACE', 'CORNERS', 'EDGES',
      'COMMENTS'
    ];

    fields.forEach(key => {
      if (d[key] !== undefined && d[key] !== '') {
        html += `<div class="field"><div class="label">${key}</div><div>${d[key]}</div></div>`;
      }
    });

    html += `<button onclick="location.reload()">Scan Another Card</button>`;
    resultDiv.innerHTML = html;
  }
</script>

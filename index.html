<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Eye Card Lookup</title>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      max-width: 520px;
      margin: auto;
      background: #f8f9fa;
    }
    h2 { text-align: center; margin-bottom: 16px; }
    button, input {
      padding: 14px 20px;
      font-size: 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      border: none;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }
    button:active { background: #1557b0; }
    input { border: 1px solid #ccc; }
    #interactive {
      width: 100%;
      margin: 16px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #interactive video, #interactive canvas {
      width: 100%;
      height: auto;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .error { color: #d32f2f; font-weight: 500; }
    .grade { font-size: 28px; font-weight: 700; color: #1a73e8; text-align: center; margin: 12px 0; }
    .field { margin: 8px 0; padding: 6px 0; border-bottom: 1px solid #eee; }
    .label { font-weight: 600; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h2>A-Eye Card Lookup</h2>
  <button id="startBtn">Start Scanner</button>
  
  <div style="margin: 16px 0;">
    <input id="manualInput" type="text" placeholder="Or type serial manually and press Enter">
  </div>

  <div id="interactive" class="viewport"></div>
  <div id="result"></div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd8c6Cg6CowtIjaqnNSKPpZ6UuOIg520o5pgYOU9WxBXUE3OeaMxaZQTZBY2MA5fVbA/exec";

    const startBtn = document.getElementById('startBtn');
    const resultDiv = document.getElementById('result');
    const manualInput = document.getElementById('manualInput');
    let scanning = false;

    startBtn.onclick = startScanner;

    manualInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        lookupBarcode(this.value.trim());
      }
    });

    function startScanner() {
      if (scanning) return;
      scanning = true;
      startBtn.style.display = 'none';
      resultDiv.innerHTML = '<p>Starting camera... Hold barcode steady in the view.</p>';

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment",
            width: { min: 640 },
            height: { min: 480 }
          }
        },
        locator: {
          patchSize: "medium",
          halfSample: true
        },
        numOfWorkers: 2,
        frequency: 10,
        decoder: {
          readers: [
            "code_128_reader",
            "ean_reader",
            "ean_8_reader",
            "code_39_reader",
            "upc_reader",
            "upc_e_reader"
          ]
        },
        locate: true
      }, function(err) {
        if (err) {
          resultDiv.innerHTML = `<p class="error">Camera error: ${err}</p>
            <button onclick="location.reload()">Try Again</button>`;
          scanning = false;
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(function(result) {
        if (!scanning) return;
        const code = result.codeResult.code;
        if (code) {
          scanning = false;
          Quagga.stop();
          resultDiv.innerHTML = `<p style="color:green;">Scanned: <strong>${code}</strong></p>`;
          lookupBarcode(code);
        }
      });
    }

    async function lookupBarcode(barcode) {
      resultDiv.innerHTML += `<p>Looking up...</p>`;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "barcode=" + encodeURIComponent(barcode)
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">Lookup failed: ${err.message}</p>
          <p>Value: ${barcode}</p>
          <button onclick="location.reload()">Try Again</button>`;
      }
    }

    function showResult(response) {
      if (response.error) {
        resultDiv.innerHTML = `<p class="error">${response.error}</p>
          <button onclick="location.reload()">Scan Again</button>`;
        return;
      }

      const d = response.data;
      let html = `<div class="grade">${d['FINAL GRADE'] || '—'}</div>`;

      const fields = ['SERIAL','CHARACTER','SET','YEAR','SET #','TCG','LANGUAGE','FOIL','CENTERING','SURFACE','CORNERS','EDGES','COMMENTS'];
      fields.forEach(key => {
        if (d[key] !== undefined && d[key] !== '') {
          html += `<div class="field"><div class="label">${key}</div><div>${d[key]}</div></div>`;
        }
      });

      html += `<button onclick="location.reload()">Scan Another Card</button>`;
      resultDiv.innerHTML = html;
    }
  </script>
</body>
</html>
